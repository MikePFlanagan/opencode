[project]
name = "quant-platform"
version = "0.1.0"
description = "Quantitative trading research platform with QuantMind-informed foundations"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-benchmark>=4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
